<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jurnal Guru Wali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --kertas:#EEF1F5; --putih:#fff; --tinta:#1E2A44; --redup:#5C6780; --garis:#C9D1DF;
  --stabilo:#F6D74A; --teal:#1F7A74; --merah:#C0392F;
  --serif:'Bitter',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--kertas);color:var(--tinta);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%;
  background-image:linear-gradient(var(--garis) 1px,transparent 1px);background-size:100% 28px;background-attachment:local}
[hidden]{display:none!important}
h1,h2{font-family:var(--serif);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* tombol */
.btn{border:2px solid var(--tinta);background:var(--putih);padding:10px 16px;border-radius:6px;font-weight:600;box-shadow:2px 2px 0 var(--tinta);min-height:44px}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.utama{background:var(--teal);color:#fff}
.btn.bahaya{color:var(--merah);border-color:var(--merah);box-shadow:2px 2px 0 var(--merah)}
.btn[disabled]{opacity:.6}

/* form */
label{display:block;font-size:14px;font-weight:600;margin:0 0 4px}
input,select,textarea{width:100%;border:2px solid var(--tinta);border-radius:6px;background:var(--putih);padding:10px 12px;min-height:44px;font-size:16px}
.baris{margin-bottom:14px}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pesan{font-size:14px;margin:10px 0 0;min-height:20px}
.pesan.galat{color:var(--merah);font-weight:600}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.kartu{background:var(--putih);border:2px solid var(--tinta);border-radius:8px;padding:24px;width:100%;max-width:380px;box-shadow:4px 4px 0 var(--tinta)}
.judul{display:inline-block;background:var(--stabilo);padding:2px 10px;transform:rotate(-1deg);margin-bottom:6px}
.sub{color:var(--redup);margin:4px 0 20px;font-size:15px}

/* app */
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--tinta);color:#fff}
header h1{font-size:18px}
header .btn{min-height:36px;padding:4px 12px;font-size:14px;box-shadow:none;background:transparent;color:#fff;border-color:#fff}
main{flex:1;overflow-y:auto;padding:16px 16px 96px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--putih);border-top:2px solid var(--tinta);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:14px 8px;font-weight:600;color:var(--redup);min-height:52px}
nav button[aria-current=page]{color:var(--tinta);box-shadow:inset 0 -4px 0 var(--stabilo)}

.alat{display:flex;gap:10px;margin-bottom:12px}
.alat input{flex:1}
.tab{display:flex;gap:8px;margin-bottom:14px}
.tab button{border:2px solid var(--tinta);background:var(--putih);border-radius:6px;padding:6px 14px;font-weight:600;min-height:40px}
.tab button[aria-pressed=true]{background:var(--stabilo)}

.murid{display:block;width:100%;text-align:left;background:var(--putih);border:2px solid var(--tinta);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.murid b{display:block;font-size:17px}
.murid span{color:var(--redup);font-size:14px}
.kosong{text-align:center;color:var(--redup);padding:32px 12px;background:var(--putih);border:2px dashed var(--garis);border-radius:8px}

.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:5}

/* dialog */
dialog{border:2px solid var(--tinta);border-radius:10px;padding:0;width:min(520px,calc(100% - 24px));max-height:92vh;background:var(--kertas)}
dialog::backdrop{background:rgba(30,42,68,.55)}
dialog form{padding:18px}
dialog h2{font-size:20px;margin-bottom:14px}
.aksi{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.aksi .btn{flex:1}

#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:6px;font-size:14px;z-index:20;max-width:90%}
@media(prefers-reduced-motion:no-preference){.btn{transition:transform .08s,box-shadow .08s}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" hidden>
  <form class="kartu" id="formLogin" autocomplete="on">
    <h1 class="judul">Jurnal Guru Wali</h1>
    <p class="sub">Masuk untuk membuka catatan pendampingan murid.</p>
    <div class="baris"><label for="un">Username</label>
      <input id="un" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required></div>
    <div class="baris"><label for="pw">Kata sandi</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn utama" style="width:100%" id="btnMasuk">Masuk</button>
    <p class="pesan" id="pesanLogin" role="alert"></p>
  </form>
</section>

<!-- APLIKASI -->
<div id="app" hidden>
  <header><h1>Jurnal Guru Wali</h1><button class="btn" id="btnKeluar">Keluar</button></header>
  <main>
    <section id="hal-murid">
      <div class="tab">
        <button data-status="aktif" aria-pressed="true">Aktif</button>
        <button data-status="arsip" aria-pressed="false">Arsip</button>
      </div>
      <div class="alat">
        <input id="cari" type="search" placeholder="Cari nama atau kelas" aria-label="Cari murid">
        <button class="btn" id="btnImpor" type="button" style="white-space:nowrap">Impor Excel</button>
        <input id="fileImpor" type="file" accept=".xlsx,.xls,.csv" hidden>
      </div>
      <div id="daftar"></div>
      <button class="btn utama fab" id="btnTambah">+ Tambah murid</button>
    </section>

    <section id="hal-pengaturan" hidden>
      <h2 class="judul" style="font-size:20px">Pengaturan</h2>
      <p class="sub">Diisi sekali, dipakai di semua murid dan cetakan.</p>
      <form id="formPengaturan">
        <div class="baris"><label for="p_sekolah">Nama sekolah</label><input id="p_sekolah" name="sekolah" placeholder="Misal: SMA Negeri 1 Contoh"></div>
        <div class="dua">
          <div class="baris"><label for="p_kepala_sekolah">Kepala sekolah</label><input id="p_kepala_sekolah" name="kepala_sekolah"></div>
          <div class="baris"><label for="p_nip_kepala">NIP kepala sekolah</label><input id="p_nip_kepala" name="nip_kepala" inputmode="numeric"></div>
          <div class="baris"><label for="p_guru_wali">Nama guru wali</label><input id="p_guru_wali" name="guru_wali"></div>
          <div class="baris"><label for="p_nip_guru_wali">NIP guru wali</label><input id="p_nip_guru_wali" name="nip_guru_wali" inputmode="numeric"></div>
          <div class="baris"><label for="p_tahun_ajaran">Tahun ajaran</label><input id="p_tahun_ajaran" name="tahun_ajaran" placeholder="2026/2027"></div>
          <div class="baris"><label for="p_semester">Semester</label>
            <select id="p_semester" name="semester"><option>Ganjil</option><option>Genap</option></select></div>
        </div>
        <div class="baris"><label for="p_kota">Kota (untuk tanda tangan)</label><input id="p_kota" name="kota"></div>
        <button class="btn utama" id="btnSimpanPengaturan">Simpan pengaturan</button>
        <p class="pesan" id="pesanPengaturan" role="status"></p>
      </form>
    </section>
  </main>
  <nav aria-label="Menu utama">
    <button data-hal="murid" aria-current="page">Murid</button>
    <button data-hal="pengaturan">Pengaturan</button>
  </nav>
</div>

<!-- FORM MURID -->
<dialog id="dlg">
  <form id="formMurid" method="dialog">
    <h2 id="dlgJudul">Tambah murid</h2>
    <div class="baris"><label for="m_nama">Nama murid</label><input id="m_nama" name="nama" required></div>
    <div class="dua">
      <div class="baris"><label for="m_nis_nisn">NIS / NISN</label><input id="m_nis_nisn" name="nis_nisn" inputmode="numeric"></div>
      <div class="baris"><label for="m_kelas">Kelas</label><input id="m_kelas" name="kelas" placeholder="Misal: X-3"></div>
      <div class="baris"><label for="m_jenis_kelamin">Jenis kelamin</label>
        <select id="m_jenis_kelamin" name="jenis_kelamin"><option value="">Pilih</option><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></div>
      <div class="baris"><label for="m_tanggal_lahir">Tanggal lahir</label><input id="m_tanggal_lahir" name="tanggal_lahir" type="date"></div>
      <div class="baris"><label for="m_nama_ortu">Nama orang tua/wali</label><input id="m_nama_ortu" name="nama_ortu"></div>
      <div class="baris"><label for="m_kontak_ortu">Kontak orang tua</label><input id="m_kontak_ortu" name="kontak_ortu" type="tel" inputmode="tel"></div>
    </div>
    <div class="baris"><label for="m_wali_kelas">Wali kelas</label><input id="m_wali_kelas" name="wali_kelas"></div>
    <p class="pesan" id="pesanMurid" role="alert"></p>
    <div class="aksi">
      <button class="btn utama" id="btnSimpanMurid" type="submit" value="simpan">Simpan murid</button>
      <button class="btn" type="button" id="btnBatal">Batal</button>
      <button class="btn bahaya" type="button" id="btnArsip" hidden>Arsipkan</button>
    </div>
  </form>
</dialog>

<!-- PRATINJAU IMPOR -->
<dialog id="dlgImpor">
  <form method="dialog" onsubmit="return false" style="padding:18px">
    <h2>Impor dari Excel</h2>
    <div id="impRingkas" style="margin-bottom:12px"></div>
    <p class="pesan" id="pesanImpor" role="alert"></p>
    <div class="aksi">
      <button class="btn utama" type="button" id="btnImporYa">Impor murid</button>
      <button class="btn" type="button" id="btnImporBatal">Batal</button>
    </div>
  </form>
</dialog>

<div id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ====== GANTI dengan alamat fungsi Anda ======
const API_URL = "https://PROJECT_REF.supabase.co/functions/v1/jurnal-api";
// =============================================

const $ = (id) => document.getElementById(id);
const KUNCI = "jgw_token";
let token = null, statusAktif = "aktif", semuaMurid = [], muridDipilih = null;

try { token = localStorage.getItem(KUNCI); } catch (e) {}

function simpanToken(t) {
  token = t;
  try { t ? localStorage.setItem(KUNCI, t) : localStorage.removeItem(KUNCI); } catch (e) {}
}

async function api(aksi, data = {}) {
  const h = { "Content-Type": "application/json" };
  if (token) h["x-sesi"] = token;
  let res;
  try {
    res = await fetch(API_URL, { method: "POST", headers: h, body: JSON.stringify({ aksi, data }) });
  } catch (e) {
    throw new Error("Tidak bisa terhubung ke server. Periksa koneksi internet.");
  }
  const j = await res.json().catch(() => ({}));
  if (res.status === 401 && aksi !== "login") { keLogin("Sesi berakhir, silakan masuk lagi."); throw new Error(""); }
  if (!res.ok) throw new Error(j.error || "Terjadi kesalahan");
  return j;
}

function toast(teks) {
  const t = $("toast"); t.textContent = teks; t.hidden = false;
  clearTimeout(toast.w); toast.w = setTimeout(() => (t.hidden = true), 2500);
}

// ---------- tampilan ----------
function keLogin(pesan = "") {
  simpanToken(null);
  $("app").hidden = true; $("login").hidden = false;
  $("pesanLogin").textContent = pesan;
  $("pesanLogin").className = "pesan" + (pesan ? " galat" : "");
}
async function keApp() {
  $("login").hidden = true; $("app").hidden = false;
  tampilHalaman("murid");
  await Promise.all([muatMurid(), muatPengaturan()]);
}
function tampilHalaman(h) {
  $("hal-murid").hidden = h !== "murid";
  $("hal-pengaturan").hidden = h !== "pengaturan";
  document.querySelectorAll("nav button").forEach((b) => {
    if (b.dataset.hal === h) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
}
document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => tampilHalaman(b.dataset.hal)));

// ---------- login ----------
$("formLogin").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("btnMasuk"); btn.disabled = true; btn.textContent = "Memeriksa...";
  $("pesanLogin").textContent = ""; $("pesanLogin").className = "pesan";
  try {
    const r = await api("login", { username: $("un").value, kata_sandi: $("pw").value });
    simpanToken(r.token); $("pw").value = "";
    await keApp();
  } catch (err) {
    $("pesanLogin").textContent = err.message; $("pesanLogin").className = "pesan galat";
  } finally { btn.disabled = false; btn.textContent = "Masuk"; }
});
$("btnKeluar").addEventListener("click", async () => {
  try { await api("logout"); } catch (e) {}
  keLogin();
});

// ---------- murid ----------
async function muatMurid() {
  try { semuaMurid = (await api("murid.daftar", { status: statusAktif })).murid || []; render(); }
  catch (e) { if (e.message) $("daftar").innerHTML = ""; if (e.message) toast(e.message); }
}
function render() {
  const q = $("cari").value.trim().toLowerCase();
  const daftar = semuaMurid.filter((m) => (m.nama + " " + (m.kelas || "")).toLowerCase().includes(q));
  const box = $("daftar"); box.innerHTML = "";
  if (!daftar.length) {
    const d = document.createElement("div"); d.className = "kosong";
    d.textContent = semuaMurid.length ? "Tidak ada murid yang cocok dengan pencarian."
      : statusAktif === "aktif" ? "Belum ada murid. Ketuk \"+ Tambah murid\" untuk memulai." : "Belum ada murid yang diarsipkan.";
    box.appendChild(d); return;
  }
  daftar.forEach((m) => {
    const b = document.createElement("button"); b.className = "murid"; b.type = "button";
    const n = document.createElement("b"); n.textContent = m.nama;
    const s = document.createElement("span");
    s.textContent = [m.kelas, m.nis_nisn].filter(Boolean).join(" / ") || "Data belum lengkap";
    b.append(n, s); b.addEventListener("click", () => bukaForm(m)); box.appendChild(b);
  });
}
document.querySelectorAll(".tab button").forEach((b) => b.addEventListener("click", () => {
  statusAktif = b.dataset.status;
  document.querySelectorAll(".tab button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  muatMurid();
}));
$("cari").addEventListener("input", render);

const KOLOM = ["nama","nis_nisn","kelas","jenis_kelamin","tanggal_lahir","nama_ortu","kontak_ortu","wali_kelas"];
function bukaForm(m = null) {
  muridDipilih = m; $("formMurid").reset(); $("pesanMurid").textContent = "";
  $("dlgJudul").textContent = m ? "Ubah data murid" : "Tambah murid";
  KOLOM.forEach((k) => ($("m_" + k).value = (m && m[k]) || ""));
  $("btnArsip").hidden = !m;
  $("btnArsip").textContent = m && m.status === "arsip" ? "Pulihkan murid" : "Arsipkan";
  $("dlg").showModal();
}
$("btnTambah").addEventListener("click", () => bukaForm());
$("btnBatal").addEventListener("click", () => $("dlg").close());

$("formMurid").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = {}; KOLOM.forEach((k) => (data[k] = $("m_" + k).value));
  if (muridDipilih) data.id = muridDipilih.id;
  const btn = $("btnSimpanMurid"); btn.disabled = true;
  try {
    await api("murid.simpan", data);
    $("dlg").close(); toast("Murid disimpan"); await muatMurid();
  } catch (err) { $("pesanMurid").textContent = err.message; $("pesanMurid").className = "pesan galat"; }
  finally { btn.disabled = false; }
});
$("btnArsip").addEventListener("click", async () => {
  const pulihkan = muridDipilih.status === "arsip";
  try {
    await api("murid.arsip", { id: muridDipilih.id, arsipkan: !pulihkan });
    $("dlg").close(); toast(pulihkan ? "Murid dipulihkan" : "Murid diarsipkan"); await muatMurid();
  } catch (err) { $("pesanMurid").textContent = err.message; $("pesanMurid").className = "pesan galat"; }
});

// ---------- pengaturan ----------
const KOLOM_P = ["sekolah","kepala_sekolah","nip_kepala","guru_wali","nip_guru_wali","kota","tahun_ajaran","semester"];
async function muatPengaturan() {
  try {
    const p = (await api("pengaturan.ambil")).pengaturan || {};
    KOLOM_P.forEach((k) => { if (p[k]) $("p_" + k).value = p[k]; });
  } catch (e) { if (e.message) toast(e.message); }
}
$("formPengaturan").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = {}; KOLOM_P.forEach((k) => (data[k] = $("p_" + k).value));
  const btn = $("btnSimpanPengaturan"); btn.disabled = true;
  try {
    await api("pengaturan.simpan", data);
    $("pesanPengaturan").textContent = "Pengaturan disimpan."; $("pesanPengaturan").className = "pesan";
  } catch (err) { $("pesanPengaturan").textContent = err.message; $("pesanPengaturan").className = "pesan galat"; }
  finally { btn.disabled = false; }
});

// ---------- impor excel ----------
const norm = (s) => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const ALIAS = {
  nama: ["nama", "nama murid", "nama siswa", "nama lengkap", "nama peserta didik", "murid", "siswa", "peserta didik"],
  nis_nisn: ["nis", "nisn", "nis nisn", "no induk", "nomor induk", "nomor induk siswa", "nis nasional"],
  kelas: ["kelas", "rombel", "rombongan belajar"],
  jenis_kelamin: ["jenis kelamin", "jk", "l p", "gender", "kelamin"],
  tanggal_lahir: ["tanggal lahir", "tgl lahir"],
  nama_ortu: ["nama orang tua", "orang tua", "nama ortu", "ortu", "nama wali", "wali murid", "nama ayah", "nama ibu"],
  kontak_ortu: ["kontak orang tua", "kontak ortu", "no hp ortu", "hp ortu", "no hp orang tua", "no hp", "telepon", "no telp", "kontak", "no wa", "wa"],
  wali_kelas: ["wali kelas"],
};
const NAMA_KOLOM = { nama: "Nama", nis_nisn: "NIS/NISN", kelas: "Kelas", jenis_kelamin: "Jenis kelamin",
  tanggal_lahir: "Tanggal lahir", nama_ortu: "Nama orang tua", kontak_ortu: "Kontak orang tua", wali_kelas: "Wali kelas" };
let hasilImpor = [];

function jk(v) {
  const n = norm(v);
  if (["l", "lk", "laki laki", "laki", "pria", "male"].includes(n)) return "L";
  if (["p", "pr", "perempuan", "wanita", "female"].includes(n)) return "P";
  return "";
}
function tgl(v) {
  const s = String(v ?? "").trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  return "";
}

$("btnImpor").addEventListener("click", () => $("fileImpor").click());
$("fileImpor").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
    const baris = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],
      { header: 1, defval: "", raw: false, dateNF: "yyyy-mm-dd" });
    olahImpor(baris);
  } catch (err) { toast("File tidak bisa dibaca. Gunakan .xlsx atau .csv."); }
});

function olahImpor(baris) {
  const h = baris.findIndex((r, i) => i < 15 && r.some((c) => ALIAS.nama.includes(norm(c))));
  if (h < 0) { toast("Kolom Nama tidak ditemukan di baris judul."); return; }
  const kol = {}, asing = [];
  baris[h].forEach((c, i) => {
    const n = norm(c); if (!n) return;
    const k = Object.keys(ALIAS).find((x) => ALIAS[x].includes(n));
    if (k && !(k in kol)) kol[k] = i; else if (!["no", "nomor", "no urut"].includes(n)) asing.push(String(c).trim());
  });
  hasilImpor = []; let kosong = 0;
  baris.slice(h + 1).forEach((r) => {
    if (r.every((c) => String(c).trim() === "")) return;
    const m = {}; for (const k in kol) m[k] = String(r[kol[k]] ?? "").trim();
    if (!m.nama) { kosong++; return; }
    m.jenis_kelamin = jk(m.jenis_kelamin); m.tanggal_lahir = tgl(m.tanggal_lahir);
    hasilImpor.push(m);
  });

  const box = $("impRingkas"); box.innerHTML = "";
  const tambah = (t, tebal) => { const p = document.createElement("p"); p.style.margin = "0 0 8px";
    if (tebal) p.style.fontWeight = "700"; p.textContent = t; box.appendChild(p); };
  tambah(`${hasilImpor.length} murid siap diimpor.`, true);
  tambah("Kolom terbaca: " + Object.keys(kol).map((k) => NAMA_KOLOM[k]).join(", ") + ".");
  if (asing.length) tambah("Kolom tidak dikenali (dilewati): " + asing.join(", ") + ".");
  if (kosong) tambah(`${kosong} baris tanpa nama dilewati.`);
  if (hasilImpor.length) tambah("Contoh: " + hasilImpor.slice(0, 3).map((m) => m.nama).join(", ") + (hasilImpor.length > 3 ? ", ..." : ""));
  if (hasilImpor.length > 300) tambah("Maksimal 300 murid sekali impor, sisanya diabaikan.");
  $("btnImporYa").disabled = !hasilImpor.length; $("pesanImpor").textContent = "";
  $("dlgImpor").showModal();
}
$("btnImporBatal").addEventListener("click", () => $("dlgImpor").close());
$("btnImporYa").addEventListener("click", async () => {
  const btn = $("btnImporYa"); btn.disabled = true; btn.textContent = "Mengimpor...";
  try {
    const r = await api("murid.impor", { murid: hasilImpor.slice(0, 300) });
    $("dlgImpor").close();
    toast(`${r.ditambah} murid ditambahkan` + (r.dilewati ? `, ${r.dilewati} sudah ada` : ""));
    await muatMurid();
  } catch (err) { $("pesanImpor").textContent = err.message; $("pesanImpor").className = "pesan galat"; }
  finally { btn.disabled = false; btn.textContent = "Impor murid"; }
});

// ---------- mulai ----------
(async () => {
  if (!token) return keLogin();
  try { await api("sesi.cek"); await keApp(); } catch (e) { if (e.message) keLogin(); }
})();
</script>
